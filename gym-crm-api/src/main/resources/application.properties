spring.application.name=gym-crm-api
server.port=${SERVER_PORT:8080}

# Use the local PostgreSQL configuration unless another profile is selected.
spring.profiles.default=local

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.elioth.epam.gymcrm.service=INFO
logging.level.com.elioth.epam.gymcrm.repository=DEBUG

# Interactive terminal menu (disabled in tests via src/test/resources/application.properties)
gymcrm.cli.enabled=false

# Logging directory
gymcrm.api.log.directory=./logs

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Supply a 32+ character HMAC secret through GYMCRM_JWT_SECRET; no secret is committed.
gymcrm.jwt.secret=${GYMCRM_JWT_SECRET}
gymcrm.cors.allowed-origins=${GYMCRM_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


## Discovery, circuit-breaker and metrics properties

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true



spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
gymcrm.messaging.trainer-workload.queue=${TRAINER_WORKLOAD_QUEUE:trainer.workload}

management.endpoints.web.exposure.include=health,prometheus
