spring.application.name=gym-crm-api
server.port=${SERVER_PORT:8080}

# Use the local PostgreSQL configuration unless another profile is selected.
spring.profiles.default=local

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.elioth.epam.gymcrm.service=INFO
logging.level.com.elioth.epam.gymcrm.repository=DEBUG

# Interactive terminal menu (disabled in tests via src/test/resources/application.properties)
gymcrm.cli.enabled=false

# Logging directory
gymcrm.api.log.directory=./logs

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Supply a 32+ character HMAC secret through GYMCRM_JWT_SECRET; no secret is committed.
gymcrm.jwt.secret=${GYMCRM_JWT_SECRET}
gymcrm.cors.allowed-origins=${GYMCRM_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


## Discovery, circuit-breaker and metrics properties

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true



gymcrm.workload-service.base-url=http://trainer-workload-service
gymcrm.workload-service.connect-timeout=${WORKLOAD_SERVICE_CONNECT_TIMEOUT:2s}
gymcrm.workload-service.read-timeout=${WORKLOAD_SERVICE_READ_TIMEOUT:3s}

resilience4j.circuitbreaker.instances.trainerWorkload.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.trainerWorkload.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.trainerWorkload.slidingWindowSize=10
resilience4j.circuitbreaker.instances.trainerWorkload.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.trainerWorkload.failureRateThreshold=50
resilience4j.circuitbreaker.instances.trainerWorkload.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.trainerWorkload.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.trainerWorkload.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.timelimiter.instances.trainerWorkload.timeoutDuration=3s
resilience4j.timelimiter.instances.trainerWorkload.cancelRunningFuture=true

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,prometheus,circuitbreakers
