name: gym-crm

services:

  postgres:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymcrm}
      POSTGRES_USER: ${POSTGRES_USER:-gymcrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - gymcrm_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

    networks:
      - gymcrm-network


  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile

    environment:
      SERVER_PORT: 8761

      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

    ports:
      - "8761:8761"

    restart: unless-stopped

    networks:
      - gymcrm-network


  activemq:
    image: docker.io/apache/activemq-classic:6.1.7

    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}

    ports:
      - "${ACTIVEMQ_PORT:-61616}:61616"
      - "${ACTIVEMQ_WEB_PORT:-8161}:8161"

    restart: unless-stopped

    networks:
      - gymcrm-network


  mongodb:
    image: docker.io/mongo:8

    ports:
      - "${MONGODB_PORT:-27017}:27017"

    volumes:
      - gymcrm_mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

    networks:
      - gymcrm-network


  trainer-workload-service:
    build:
      context: .
      dockerfile: trainer-workload-service/Dockerfile

    environment:
      SERVER_PORT: 8081

      EUREKA_URL: http://discovery-server:8761/eureka/

      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}

      MONGODB_URI: mongodb://mongodb:27017/trainer_workload

      GYMCRM_JWT_SECRET: ${GYMCRM_JWT_SECRET:?GYMCRM_JWT_SECRET is required}

    ports:
      - "8081:8081"

    depends_on:
      discovery-server:
        condition: service_started

      activemq:
        condition: service_started

      mongodb:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - gymcrm-network


  gym-crm-api:
    build:
      context: .
      dockerfile: gym-crm-api/Dockerfile

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: >
        jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gymcrm}

      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gymcrm_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      EUREKA_URL: http://discovery-server:8761/eureka/

      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}

      GYMCRM_JWT_SECRET: ${GYMCRM_JWT_SECRET:?GYMCRM_JWT_SECRET is required}

      # Swagger UI is loaded by the host browser, so localhost is correct here.
      WORKLOAD_OPENAPI_URL: >
        http://localhost:8081/v3/api-docs

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

      discovery-server:
        condition: service_started

      trainer-workload-service:
        condition: service_started

      activemq:
        condition: service_started

    restart: unless-stopped

    networks:
      - gymcrm-network


volumes:
  gymcrm_postgres_data:
    name: gymcrm_postgres_data
  gymcrm_mongodb_data:
    name: gymcrm_mongodb_data


networks:
  gymcrm-network:
    name: gymcrm-network
    driver: bridge
