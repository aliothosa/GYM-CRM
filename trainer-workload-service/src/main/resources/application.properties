# Application
spring.application.name=trainer-workload-service
server.port=${SERVER_PORT:8081}

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:trainer_workload;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema. Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT: use the same environment secret as gym-crm-api
gymcrm.jwt.secret=${GYMCRM_JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

## Logging
# Archivo principal
logging.file.name=./logs/workload-microservice/workload-microservice.log

# Niveles
logging.level.root=INFO
logging.level.com.elioth.epam.workload=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Formato en consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [transactionId=%X{transactionId}] [%logger{36}] %msg%n

# Formato en archivo
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [transactionId=%X{transactionId}] [%logger{36}] %msg%n

# Rotación
logging.logback.rollingpolicy.file-name-pattern=./logs/workload-microservice/archive/workload-microservice.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false
