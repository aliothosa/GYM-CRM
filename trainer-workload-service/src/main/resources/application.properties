# Application
spring.application.name=trainer-workload-service
server.port=${SERVER_PORT:8081}

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trainer_workload}
spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT: use the same environment secret as gym-crm-api
gymcrm.jwt.secret=${GYMCRM_JWT_SECRET}

# ActiveMQ
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
gymcrm.messaging.trainer-workload.queue=${TRAINER_WORKLOAD_QUEUE:trainer.workload}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

## Logging
# Archivo principal
logging.file.name=./logs/workload-microservice/workload-microservice.log

# Niveles
logging.level.root=INFO
logging.level.com.elioth.epam.workload=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN

# Formato en consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [transactionId=%X{transactionId}] [%logger{36}] %msg%n

# Formato en archivo
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [transactionId=%X{transactionId}] [%logger{36}] %msg%n

# Rotación
logging.logback.rollingpolicy.file-name-pattern=./logs/workload-microservice/archive/workload-microservice.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.clean-history-on-start=false
